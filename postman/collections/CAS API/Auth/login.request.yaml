$kind: http-request
name: login
url: https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={{firebaseWebApiKey}}
method: POST
headers:
  Content-Type: application/json
queryParams:
  key: "{{firebaseWebApiKey}}"
body:
  type: json
  content: |-
    {
      "email": "khuongxuantoan@gmail.com",
      "password": "password123",
      "returnSecureToken": true
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      pm.environment.set('firebaseIdToken', response.idToken);
order: 1000
