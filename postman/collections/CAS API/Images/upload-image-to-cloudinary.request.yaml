$kind: http-request
name: Upload image to Cloudinary
url: "https://api.cloudinary.com/v1_1/{{cloudinaryCloudName}}/image/upload"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
      description: "Chọn ảnh cần tải lên từ máy cục bộ."
      disabled: false
    - type: text
      key: api_key
      value: "{{cloudinaryApiKey}}"
      disabled: false
    - type: text
      key: timestamp
      value: "{{cloudinaryTimestamp}}"
      disabled: false
    - type: text
      key: signature
      value: "{{cloudinarySignature}}"
      disabled: false
    - type: text
      key: folder
      value: "{{cloudinaryFolder}}"
      disabled: false
    - type: text
      key: public_id
      value: "{{cloudinaryPublicId}}"
      disabled: false
    - type: text
      key: upload_preset
      value: "{{cloudinaryUploadPreset}}"
      disabled: false
order: 3000
