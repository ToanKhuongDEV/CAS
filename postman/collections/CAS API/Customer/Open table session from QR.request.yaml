$kind: http-request
name: Open table session from QR
url: "{{baseUrl}}/api/v1/customer/table-sessions/resolve-qr"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "qrToken": "{{customerQrToken}}",
      "customerName": "{{customerName}}",
      "customerPhone": "{{customerPhone}}"
    }
order: 2000
