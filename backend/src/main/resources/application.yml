spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cas-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:cas}
    password: ${DB_PASSWORD:cas}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: vn.cas
  type-handlers-package: vn.cas.common.persistence

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cas:
  firebase:
    service-account-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  web:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
